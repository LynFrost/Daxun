<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <label>Volume</label>
      <div class="value-display"><span id="volumeValue">50</span>%</div>
    </div>
    <div class="slider-container">
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01">
    </div>
    <button class="section-header" id="soundHeader">
      <span>Sound</span>
      <span class="chevron" id="soundChevron"></span>
    </button>
    <div class="sound-list" id="soundList"></div>
    <div class="toggle-row">
      <label for="systemNotifyToggle">System Notification</label>
      <label class="switch">
        <input type="checkbox" id="systemNotifyToggle">
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="hint-text">Show a desktop alert when ChatGPT finishes responding.</div>
    <div class="toggle-row">
      <label for="qaPreviewToggle">Show Q&amp;A Preview</label>
      <label class="switch">
        <input type="checkbox" id="qaPreviewToggle">
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="hint-text">Display question and answer excerpts in system notifications. Off by default for privacy.</div>

    <div class="sync-section">
      <div class="section-title">跨电脑通知同步</div>
      <div class="hint-text">使用 ntfy.sh 公共主题。随机主题并非加密或身份认证；知晓主题的人可以收发消息。请勿同步敏感内容。</div>
      <div class="toggle-row">
        <label for="syncSendToggle">允许跨电脑发送</label>
        <label class="switch"><input type="checkbox" id="syncSendToggle"><span class="switch-slider"></span></label>
      </div>
      <div class="toggle-row">
        <label for="syncReceiveToggle">允许跨电脑接收</label>
        <label class="switch"><input type="checkbox" id="syncReceiveToggle"><span class="switch-slider"></span></label>
      </div>
      <div class="toggle-row">
        <label for="syncPreviewToggle">允许远程传输问答摘要</label>
        <label class="switch"><input type="checkbox" id="syncPreviewToggle"><span class="switch-slider"></span></label>
      </div>
      <div class="hint-text">默认关闭。只有同时开启本机问答预览及此授权才会发送摘要；否则仅发送通用提醒。摘要会经过第三方 ntfy.sh。</div>
      <label for="syncNameInput">本机设备名称</label>
      <input class="sync-input" id="syncNameInput" type="text" maxlength="40" placeholder="例如 XF / 工位电脑">
      <label for="syncTopicInput">通信主题（多台电脑填写相同主题）</label>
      <input class="sync-input" id="syncTopicInput" type="text" maxlength="128" autocomplete="off" spellcheck="false" placeholder="至少22位的随机主题">
      <div class="sync-actions">
        <button type="button" id="syncGenerateTopic">生成随机主题</button>
        <button type="button" id="syncTestButton">发送测试消息</button>
      </div>
      <div class="hint-text" id="syncStatus" role="status" aria-live="polite">跨电脑同步默认关闭</div>
    </div>
    <div class="footer">
      <span class="version" id="versionLabel"></span>
      <a class="github-link" href="https://github.com/Taragryen/chatgpt-notifier" target="_blank" title="GitHub">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </div>
  </div>
  <script type="module" src="./App.ts"></script>
</body>
</html>
